<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f9fafb;
      color: #111827;
    }
    h3 { margin-top: 0; color: #1f2937; display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 9999px; background: #e5e7eb; }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    
    .result-box { margin-top: 15px; display: none; }
    .metric { background: white; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 8px; }
    .metric-title { font-size: 0.85rem; color: #4b5563; margin-bottom: 4px; }
    .metric-value { font-size: 1rem; font-weight: bold; display: flex; justify-content: space-between; }
    
    /* Прогресс-бар для вероятностей */
    .bar-container { background: #e5e7eb; height: 6px; border-radius: 3px; margin-top: 5px; overflow: hidden; }
    .bar { height: 100%; width: 0%; transition: width 0.3s; background-color: 0.3s }
    
    /* Цветовые статусы риска */
    .risk-safe { color: #16a34a; }
    .risk-warning { color: #d97706; }
    .risk-danger { color: #dc2626; }

    /* Сводка по структуре страницы */
    .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 2px 0; }
    .summary-row strong { font-weight: 600; }

    /* Список потенциально опасных элементов */
    .findings-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .finding-item { border-left: 3px solid #9ca3af; background: #f9fafb; border-radius: 4px; padding: 6px 8px; cursor: pointer; }
    .finding-item:hover { background: #f3f4f6; }
    .finding-item.severity-critical { border-left-color: #b91c1c; }
    .finding-item.severity-high { border-left-color: #ea580c; }
    .finding-item.severity-medium { border-left-color: #d97706; }
    .finding-item.severity-low { border-left-color: #2563eb; }
    .finding-title { font-size: 0.8rem; font-weight: 600; color: #111827; display: flex; justify-content: space-between; gap: 6px; }
    .finding-detail { font-size: 0.72rem; color: #6b7280; word-break: break-all; }
    .findings-empty { font-size: 0.8rem; color: #16a34a; }
    #clearBtn { margin-top: 10px; background-color: #6b7280; display: none; }
    #clearBtn:hover { background-color: #4b5563; }
    
    #loader { display: none; text-align: center; color: #4b5563; font-size: 0.9rem; margin: 15px 0; }
  </style>
</head>
<body>

  <h3>Jev AI Shield <span class="badge">System 1</span></h3>
  <button id="scanBtn">Сканировать страницу</button>

  <div id="loader">Анализ структуры Jev AI (~100мс)...</div>

  <div id="resultBox" class="result-box">
    <!-- Метрика 1: Вероятность фишинга (Noul) -->
    <div class="metric">
      <div class="metric-title">Угроза фишинга / Спуфинга (Noul)</div>
      <div class="metric-value" id="phishingVal">0%</div>
      <div class="bar-container"><div id="phishingBar" class="bar"></div></div>
    </div>

    <!-- Метрика 1b: Обманный сбор данных (Noul) -->
    <div class="metric">
      <div class="metric-title">Обманный сбор учётных данных (Noul)</div>
      <div class="metric-value" id="harvestVal">0%</div>
      <div class="bar-container"><div id="harvestBar" class="bar"></div></div>
    </div>

    <!-- Метрика 2: Категория риска (Choice) -->
    <div class="metric">
      <div class="metric-title">Основной вектор атаки (Choice)</div>
      <div class="metric-value" id="categoryVal">-</div>
    </div>

    <!-- Метрика 3: Общий уровень опасности (Score) -->
    <div class="metric">
      <div class="metric-title">Индекс опасности кода (Score)</div>
      <div class="metric-value"><span id="scoreVal">0/5</span></div>
      <div class="bar-container"><div id="scoreBar" class="bar"></div></div>
    </div>
  </div>

  <!-- Сводка по структуре страницы -->
  <div id="summaryBox" class="result-box">
    <div class="metric">
      <div class="metric-title">Структура страницы</div>
      <div id="summaryList"></div>
    </div>
  </div>

  <!-- Локально найденные опасные элементы -->
  <div id="findingsBox" class="result-box">
    <div class="metric">
      <div class="metric-title">
        Потенциально опасные элементы
        <span id="findingsCount" class="badge">0</span>
      </div>
      <div id="findingsList" class="findings-list"></div>
    </div>
  </div>

  <button id="clearBtn">Снять подсветку со страницы</button>

  <script src="popup.js"></script>
</body>
</html>
