<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f9fafb;
      color: #111827;
    }
    h3 { margin-top: 0; color: #1f2937; display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 9999px; background: #e5e7eb; }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    
    .result-box { margin-top: 15px; display: none; }
    .metric { background: white; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 8px; }
    .metric-title { font-size: 0.85rem; color: #4b5563; margin-bottom: 4px; }
    .metric-value { font-size: 1rem; font-weight: bold; display: flex; justify-content: space-between; }
    
    /* Progress bar for probabilities */
    .bar-container { background: #e5e7eb; height: 6px; border-radius: 3px; margin-top: 5px; overflow: hidden; }
    .bar { height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; }
    
    /* Risk color statuses */
    .risk-safe { color: #16a34a; }
    .risk-warning { color: #d97706; }
    .risk-danger { color: #dc2626; }

    /* Settings: saving the API key */
    .settings-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .settings-card label { display: block; font-size: 0.8rem; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 0.85rem;
      color: #111827;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }
    input[type="password"]:focus { outline: none; border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .save-status { min-height: 14px; margin-top: 5px; font-size: 0.72rem; }
    .save-status.ok { color: #16a34a; }
    .save-status.error { color: #dc2626; }
    #saveBtn { margin-top: 7px; background-color: #6b7280; }
    #saveBtn:hover { background-color: #4b5563; }
    #saveBtn.saved { background-color: #16a34a; }

    /* Toggle for automatic removal of dangerous elements on page load */
    .toggle-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; }
    .settings-card .toggle-row label {
      display: block;
      margin-bottom: 0;
      font-size: 0.78rem;
      font-weight: 500;
      color: #4b5563;
      cursor: pointer;
    }
    .toggle-row input[type="checkbox"] {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      margin-top: 1px;
      cursor: pointer;
    }

    #loader { display: none; text-align: center; color: #4b5563; font-size: 0.9rem; margin: 15px 0; }
  </style>
</head>
<body>

  <h3>Jev AI Shield <span class="badge">System 1</span></h3>

  <!-- Settings: the TypeSafe Jev API key is stored in chrome.storage.local -->
  <div class="settings-card">
    <label for="apiKey">TypeSafe Jev API token</label>
    <input type="password" id="apiKey" placeholder="apikey_..." autocomplete="off">
    <button id="saveBtn" aria-label="Save settings">Save settings</button>
    <div id="saveStatus" class="save-status" role="status" aria-live="polite"></div>

    <!-- Automatic removal of dangerous elements on page load -->
    <div class="toggle-row">
      <input type="checkbox" id="autoRemove">
      <label for="autoRemove">Automatically remove dangerous elements on page load</label>
    </div>
  </div>

  <button id="scanBtn">Scan page</button>

  <div id="loader">Jev AI structure analysis (~100ms)...</div>

  <div id="resultBox" class="result-box">
    <!-- Metric 1: Phishing probability (Noul) -->
    <div class="metric">
      <div class="metric-title">Phishing / spoofing threat (Noul)</div>
      <div class="metric-value" id="phishingVal">0%</div>
      <div class="bar-container"><div id="phishingBar" class="bar"></div></div>
    </div>

    <!-- Metric 1b: Deceptive data harvesting (Noul) -->
    <div class="metric">
      <div class="metric-title">Credential harvesting (Noul)</div>
      <div class="metric-value" id="harvestVal">0%</div>
      <div class="bar-container"><div id="harvestBar" class="bar"></div></div>
    </div>

    <!-- Metric 2: Risk category (Choice) -->
    <div class="metric">
      <div class="metric-title">Main attack vector (Choice)</div>
      <div class="metric-value" id="categoryVal">-</div>
    </div>

    <!-- Metric 3: Overall risk level (Score) -->
    <div class="metric">
      <div class="metric-title">Code risk index (Score)</div>
      <div class="metric-value"><span id="scoreVal">0/5</span></div>
      <div class="bar-container"><div id="scoreBar" class="bar"></div></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
